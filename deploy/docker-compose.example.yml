# Example compose for integrators – change secrets/config only, no code changes required.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bugreport
      POSTGRES_PASSWORD: bugreport
      POSTGRES_DB: bugreport
    volumes:
      - bugreport_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugreport"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional local object storage (MinIO). Point Storage__* at your cloud OSS/S3 instead if preferred.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bugreport_minio:/data

  bugreport-server:
    image: ghcr.io/setsuodu/bugreport-server:1.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=bugreport;Username=bugreport;Password=bugreport
      - Storage__Endpoint=http://minio:9000
      - Storage__Bucket=bugreport-attachments
      - Storage__AccessKey=minioadmin
      - Storage__SecretKey=minioadmin
      - Storage__ForcePathStyle=true
      - Auth__IngestApiKey=change-me-ingest
      - Auth__AdminApiKey=change-me-admin
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "8080:8080"

volumes:
  bugreport_pgdata:
  bugreport_minio:
