# Visual Studio / CLI: run from server/ directory
#   docker compose up -d --build
#
# Host port plan (company-wide, avoid classic 8080/5432/6379/9000):
#   bugreport-server  12080 → 8080
#   bugreport-db      12032 → 5432
#   minio S3          12090 → 9000
#   minio console     12091 → 9001

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bugreport
      POSTGRES_PASSWORD: bugreport
      POSTGRES_DB: bugreport
    volumes:
      - bugreport_pgdata:/var/lib/postgresql/data
    ports:
      - "12032:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugreport -d bugreport"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for report attachments.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "12090:9000"
      - "12091:9001"
    volumes:
      - bugreport_minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/bugreport-attachments || true;
      mc anonymous set download local/bugreport-attachments || true;
      exit 0;
      "

  bugreport-server:
    build:
      context: ..
      dockerfile: server/src/BugReport.Server.Api/Dockerfile
    image: bugreport-server:local
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=bugreport;Username=bugreport;Password=bugreport
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: bugreport-attachments
      Storage__AccessKey: minioadmin
      Storage__SecretKey: minioadmin
      Storage__ForcePathStyle: "true"
      Auth__IngestApiKey: dev-ingest-key
      Auth__AdminApiKey: dev-admin-key
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "12080:8080"

volumes:
  bugreport_pgdata:
  bugreport_minio:
