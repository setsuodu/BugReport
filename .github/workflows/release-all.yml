name: Release All

on:
  push:
    tags:
      - 'v*'
      # Exclude client-v* and server-v* (those are handled by dedicated workflows)
      # GitHub tag filter is prefix-based; we guard in job conditions.

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.ok }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == client-v* || "$TAG" == server-v* ]]; then
            echo "ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ok=true" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

  release-server:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/bugreport-server
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/src/BugReport.Server.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.guard.outputs.version }}
          platforms: linux/amd64

  release-client:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump package version
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('client/com.setsuodu.bugreport/package.json')
          data = json.loads(p.read_text())
          data['version'] = '${{ needs.guard.outputs.version }}'
          p.write_text(json.dumps(data, indent=2) + '\n')
          "
      - name: Publish to OpenUPM (placeholder)
        run: |
          echo "Joint release client+server version ${{ needs.guard.outputs.version }}"
          echo "Wire OpenUPM submission here."
