name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client-tests:
    if: |
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.changed_files, 'client/') || true) ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    # Unity Test Runner typically needs a licensed Unity image / self-hosted runner.
    # Placeholder: validate package.json and structure only in open CI.
    steps:
      - uses: actions/checkout@v4
      - name: Validate client package
        run: |
          test -f client/com.company.bugreport/package.json
          test -f client/com.company.bugreport/Runtime/BugReporter.cs
          echo "Client package structure OK"
          # Full Unity Test Runner: wire to game-ci/unity-test-runner when license available.

  server-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BugReport.Server.sln
      - name: Build
        run: dotnet build BugReport.Server.sln -c Release --no-restore
      - name: Publish AOT (compatibility check)
        run: |
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          dotnet publish src/BugReport.Server.Api/BugReport.Server.Api.csproj \
            -c Release -r linux-x64 -o /tmp/bugreport-aot \
            -p:PublishAot=true
        # Treat IL2026/IL3050 as errors via project settings if desired.
