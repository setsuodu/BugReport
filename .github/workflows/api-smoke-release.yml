name: API Smoke (Release Tag)

on:
  push:
    tags: ["v*", "server-v*"]
  workflow_dispatch:

jobs:
  smoke:
    name: Compose + Smoke (tag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare .env
        working-directory: server
        run: cp -n .env.example .env 2>/dev/null || cp .env.example .env

      - name: Up
        working-directory: server
        run: |
          docker compose up --build -d
          for i in $(seq 1 120); do
            if curl -sf "http://127.0.0.1:12080/health" >/dev/null; then
              echo "OK health"
              exit 0
            fi
            sleep 2
          done
          docker compose logs || true
          exit 1

      - name: Smoke
        working-directory: server
        env:
          BASE: http://127.0.0.1:12080
          INGEST_KEY: dev-ingest-key
          ADMIN_KEY: dev-admin-key
          PROJECT_ID: smoke-release
        run: python scripts/smoke_test.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugreport-smoke-release-${{ github.ref_name }}-${{ github.sha }}
          path: server/test-results/
          retention-days: 90
          if-no-files-found: warn

      - name: Teardown
        if: always()
        working-directory: server
        run: docker compose down -v || true
